# The boards built, every one: the data checked, every glue compiled against test/fake on the
# host, then examples/hello_board built for every board under two versions of ESP-IDF, the
# oldest the manifest promises and the newest. A board that does not build does not merge.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: the data, the glue, the Kconfig and the manifest agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_boards.py --host-syntax
      - run: pip install jsonschema && python3 tools/check_format.py
      - run: python3 tools/board_pins.py --all

  build:
    name: ${{ matrix.board }}${{ matrix.module && format(' + {0}', matrix.module) || '' }} on ESP-IDF ${{ matrix.idf }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [cyd_s028r, esp32_devkit, esp32_p4_eth, esp32_p4_poe_eth, esp32s3_devkit, jc1060p470c, jc4827w543c, jc8012p4a1c]
        idf: [release-v5.5, v6.1]
        module: [""]
        include:
          - board: jc1060p470c
            idf: v6.1
            module: lcd2004_pcf8574
    steps:
      - uses: actions/checkout@v4
      - name: choose the board
        run: |
          python3 tools/board_select.py ${{ matrix.board }} ${{ matrix.module && format('--module {0}', matrix.module) || '' }} examples/hello_board
          python3 tools/board_select.py ${{ matrix.board }} examples/hello_lvgl
          python3 -c "import sys; sys.path.insert(0, 'tools'); import resolve; board = resolve.resolve(resolve.load('boards', '${{ matrix.board }}')); print('target=' + board['mcu']['target']); print('graphics=' + str(any((device.get('config') or {}).get('kind') == 'graphics' for device in board['devices'].values())).lower())" >> "$GITHUB_OUTPUT"
        id: board
      - name: build hello_board
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ steps.board.outputs.target }}
          path: examples/hello_board
          command: idf.py build
      - name: build hello_lvgl
        if: ${{ !matrix.module && steps.board.outputs.graphics == 'true' }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ steps.board.outputs.target }}
          path: examples/hello_lvgl
          command: idf.py build

  local-boards:
    name: a board of the program on ESP-IDF ${{ matrix.idf }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.5, v6.1]
    steps:
      - uses: actions/checkout@v4
      - name: choose the board
        run: python3 tools/board_select.py my_board examples/local_boards
      - name: build examples/local_boards
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: examples/local_boards
          command: idf.py build
