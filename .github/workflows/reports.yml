# A report in an issue becomes a pull request: a person merges it. The text of an issue comes from anyone, so
# it reaches the tool through a file and never through the text of a step.
name: reports

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

# A form with a label gives two events, opened and labeled, and an edit gives one more: the newest run reads the issue
# as it stands now, and the run before it is cancelled.
concurrency:
  group: report-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  price:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'price') && (github.event.action != 'labeled' || github.event.label.name == 'price')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the price
        id: take
        env:
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          printenv BODY > "$RUNNER_TEMP/body.md"
          pip install jsonschema
          # 0: the price is taken. 3, NEW_SHOP of take_report.py: taken with a shop the catalog lacked, which has no title
          # until a person writes it, so check_format fails on it and the pull request says so.
          taken=0
          python3 tools/take_report.py "$RUNNER_TEMP/body.md" --issue "$NUMBER" > "$RUNNER_TEMP/said.txt" 2>&1 || taken=$?
          if [ "$taken" != 0 ] && [ "$taken" != 3 ]; then
            echo "failed=1" >> "$GITHUB_OUTPUT"
          elif ! python3 tools/check_format.py > "$RUNNER_TEMP/checked.txt" 2>&1 && [ "$taken" = 0 ]; then
            # the catalog is checked only with the price in it: a refused report gets its reason alone
            cat "$RUNNER_TEMP/checked.txt" >> "$RUNNER_TEMP/said.txt"
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
          { echo "Closes #$NUMBER"; echo; cat "$RUNNER_TEMP/said.txt"; } > "$RUNNER_TEMP/pull.md"
          if [ "$taken" = 3 ]; then
            { echo; echo "<details><summary>check_format.py</summary>"; echo; echo '```'; cat "$RUNNER_TEMP/checked.txt"; echo '```'
              echo "</details>"; } >> "$RUNNER_TEMP/pull.md"
          fi
      - name: Say what went wrong
        if: steps.take.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '\nEdit the issue to correct it: the edited text is read again.\n' >> "$RUNNER_TEMP/said.txt"
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/said.txt"
          exit 1
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "boards reports"
          git config user.email "reports@users.noreply.github.com"
          git switch -c "report-$NUMBER"
          git add catalog
          git commit -m "add a price from issue $NUMBER"
          # report-N belongs to this job: another run takes the issue as it stands now.
          git push --force origin "report-$NUMBER"
          if [ "$(gh pr list --head "report-$NUMBER" --json number --jq length)" = 0 ]; then
            gh pr create --fill --body-file "$RUNNER_TEMP/pull.md"
          else
            gh pr edit "report-$NUMBER" --body-file "$RUNNER_TEMP/pull.md"
          fi
