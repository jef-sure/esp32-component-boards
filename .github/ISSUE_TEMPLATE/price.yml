name: A price
description: What you paid, or saw, for a board or a module of the catalog.
title: "price: "
labels: [price]
body:
  - type: input
    id: item
    attributes:
      label: Item
      description: As in the catalog, such as modules/pn532_module or boards/esp32_devkit.
    validations:
      required: true
  - type: input
    id: shop
    attributes:
      label: Shop
      description: Its name or its address, such as aliexpress.com or LCSC.
    validations:
      required: true
  - type: input
    id: seller
    attributes:
      label: Seller
      description: On a marketplace such as AliExpress, eBay or Amazon, the seller or store, when you know it.
  - type: input
    id: currency
    attributes:
      label: Currency
      description: Three letters, such as EUR, USD or INR.
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: Price of one
      description: One number, as 3.76, 3,76 or 1.234,56, or a range as 3-5. Without delivery.
    validations:
      required: true
  - type: input
    id: qty
    attributes:
      label: Pack of
      description: How many in a pack, when it is not sold by one.
