# A report in an issue becomes a pull request: a person merges it. The text of an issue comes from anyone, so
# it reaches the tool through a file and never through the text of a step.
name: reports

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# A form with a label may give two events, and a label may be set again: the runs of one issue go one by one.
concurrency:
  group: report-${{ github.event.issue.number }}

jobs:
  price:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'price') && (github.event.action == 'opened' || github.event.label.name == 'price')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the price
        id: take
        env:
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          printenv BODY > "$RUNNER_TEMP/body.md"
          pip install jsonschema
          python3 tools/take_report.py "$RUNNER_TEMP/body.md" --issue "$NUMBER" > "$RUNNER_TEMP/said.txt" 2>&1 || echo "failed=1" >> "$GITHUB_OUTPUT"
          python3 tools/check_format.py >> "$RUNNER_TEMP/said.txt" 2>&1 || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: Say what went wrong
        if: steps.take.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/said.txt"
          exit 1
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "boards reports"
          git config user.email "reports@users.noreply.github.com"
          git switch -c "report-$NUMBER"
          git add catalog
          git commit -m "add a price from issue $NUMBER"
          # report-N belongs to this job: another run takes the issue as it stands now.
          git push --force origin "report-$NUMBER"
          if [ "$(gh pr list --head "report-$NUMBER" --json number --jq length)" = 0 ]; then
            gh pr create --fill --body "Closes #$NUMBER"
          fi
