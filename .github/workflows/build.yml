# The boards built, every one: the data checked, every glue compiled against test/fake on the
# host, then examples/hello_board built for every board under two versions of ESP-IDF, the
# oldest the manifest promises and the newest, and for the computer, where it runs and its window
# is checked as a picture. A board that does not build does not merge.
# The checks run on every branch, so a working branch is not left without them; the builds on
# main and on pull requests.
name: build

# CI runs for main, a pull request and by hand: a branch pushed beside main ran the same commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: the data, the glue, the Kconfig and the manifest agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_boards.py --host-syntax
      - run: pip install jsonschema && python3 tools/check_format.py
      - run: python3 tools/board_pins.py --all

  build:
    name: ${{ matrix.board }} on ESP-IDF ${{ matrix.idf }}
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # boards: generated by tools/boards_gen.py --all from the data, do not edit here
        board: [cyd_s028r, esp32_c3_oled_042, esp32_c3_zero, esp32_c6_supermini, esp32_devkit, esp32_devkit_usb_c, esp32_oled_096, esp32_p4_eth, esp32_p4_poe_eth, esp32_s3_zero, esp32_wrover_dev, esp32s3_devkit, jc1060p470c, jc4827w543c, jc8012p4a1c, nodemcu_esp32s]
        # boards: end of generated
        idf: [release-v5.5, v6.1]
    steps:
      - uses: actions/checkout@v4
      # the component manager keeps what it downloads in .component-cache, which actions/cache keeps between runs:
      # a run took DGX from the registry some 60 times
      - name: keep the components downloaded
        uses: actions/cache@v4
        with:
          path: .component-cache
          key: components-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: components-
      - name: choose the board
        run: |
          python3 tools/board_select.py ${{ matrix.board }} examples/hello_board
          python3 tools/board_select.py ${{ matrix.board }} examples/hello_lvgl
          python3 tools/board_select.py ${{ matrix.board }} examples/sound_level
          python3 -c "import sys; sys.path.insert(0, 'tools'); import resolve; board = resolve.resolve(resolve.load('boards', '${{ matrix.board }}')); print('target=' + board['mcu']['target']); print('graphics=' + str(any((device.get('config') or {}).get('kind') == 'graphics' for device in board['devices'].values())).lower()); print('sound=' + str(any('audio' in (device.get('classes') or []) for device in board['devices'].values())).lower())" >> "$GITHUB_OUTPUT"
        id: board
      - name: build hello_board
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ steps.board.outputs.target }}
          path: examples/hello_board
          command: ${{ matrix.idf == 'v6.1' && 'idf.py build' || format('idf.py -B build/{0} -D SDKCONFIG=build/{0}/sdkconfig -D BOARD={0} build', matrix.board) }}
      - name: build hello_lvgl
        if: ${{ steps.board.outputs.graphics == 'true' }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ steps.board.outputs.target }}
          path: examples/hello_lvgl
          command: ${{ matrix.idf == 'v6.1' && 'idf.py build' || format('idf.py -B build/{0} -D SDKCONFIG=build/{0}/sdkconfig -D BOARD={0} build', matrix.board) }}
      - name: build sound_level
        if: ${{ steps.board.outputs.sound == 'true' }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ steps.board.outputs.target }}
          path: examples/sound_level
          command: ${{ matrix.idf == 'v6.1' && 'idf.py build' || format('idf.py -B build/{0} -D SDKCONFIG=build/{0}/sdkconfig -D BOARD={0} build', matrix.board) }}

  parts-left-alone:
    name: a project that leaves parts alone on ESP-IDF ${{ matrix.idf }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.5, v6.1]
    steps:
      - uses: actions/checkout@v4
      # the component manager keeps what it downloads in .component-cache, which actions/cache keeps between runs:
      # a run took DGX from the registry some 60 times
      - name: keep the components downloaded
        uses: actions/cache@v4
        with:
          path: .component-cache
          key: components-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: components-
      - name: write the project as the page does
        run: |
          mkdir -p examples/hello_board/components/local-boards/boards/project_unused
          cp test/format/good/project_unused_parts.json examples/hello_board/components/local-boards/boards/project_unused/board.json
          python3 tools/board_select.py project_unused examples/hello_board
      - name: build it
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: examples/hello_board
          command: ${{ matrix.idf == 'v6.1' && 'idf.py build' || 'idf.py -B build/project_unused -D SDKCONFIG=build/project_unused/sdkconfig -D BOARD=project_unused build' }}

  local-boards:
    name: a board of the program with a display and a 2004 on ESP-IDF ${{ matrix.idf }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.5, v6.1]
    steps:
      - uses: actions/checkout@v4
      # the component manager keeps what it downloads in .component-cache, which actions/cache keeps between runs:
      # a run took DGX from the registry some 60 times
      - name: keep the components downloaded
        uses: actions/cache@v4
        with:
          path: .component-cache
          key: components-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: components-
      - name: choose the board
        run: python3 tools/board_select.py my_board examples/local_boards
      - name: build examples/local_boards
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: examples/local_boards
          command: ${{ matrix.idf == 'v6.1' && 'idf.py build' || 'idf.py -B build/my_board -D SDKCONFIG=build/my_board/sdkconfig -D BOARD=my_board build' }}

  host:
    name: the computer as the ${{ matrix.shows }} on ESP-IDF ${{ matrix.idf }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.5, v6.1]
        # a glass shown as it is, and one turned in the window as the board is held
        shows: [jc4827w543c, cyd_s028r]
    steps:
      - uses: actions/checkout@v4
      # the component manager keeps what it downloads in .component-cache, which actions/cache keeps between runs:
      # a run took DGX from the registry some 60 times
      - name: keep the components downloaded
        uses: actions/cache@v4
        with:
          path: .component-cache
          key: components-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: components-
      - name: choose the computer
        run: |
          python3 tools/board_select.py host --as ${{ matrix.shows }} examples/hello_board
          python3 tools/board_select.py host --as ${{ matrix.shows }} test/host_buttons
      - name: build hello_board for the linux target, run it with no screen, check the picture of its window and its touch, the mouse
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: linux
          path: examples/hello_board
          command: >-
            apt-get update -qq && apt-get install -y -qq --no-install-recommends pkg-config libsdl2-dev libbsd-dev > /dev/null &&
            ${{ matrix.idf == 'v6.1' && 'idf.py build' || 'idf.py -B build/host -D SDKCONFIG=build/host/sdkconfig -D BOARD=host build' }} &&
            { SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy DGX_HOST_QUIT_MS=1000 DGX_HOST_SHOT=build/host/shot.ppm timeout 60 build/host/hello_board.elf > build/host/run.log || { cat build/host/run.log; false; }; } &&
            cat build/host/run.log && grep -q "^the touch: 1 fingers" build/host/run.log &&
            python3 ../../test/host_shot.py build/host/shot.ppm
      - name: build test/host_buttons and press its buttons by a script of keys
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: linux
          path: test/host_buttons
          command: >-
            apt-get update -qq && apt-get install -y -qq --no-install-recommends pkg-config libsdl2-dev libbsd-dev > /dev/null &&
            ${{ matrix.idf == 'v6.1' && 'idf.py build' || 'idf.py -B build/host -D SDKCONFIG=build/host/sdkconfig -D BOARD=host build' }} &&
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy DGX_HOST_SCRIPT=buttons.script timeout 60 build/host/host_buttons.elf

  multi-board:
    name: one program for two boards on ESP-IDF ${{ matrix.idf }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESP-IDF 6 reads CMakePresets.json: idf.py build builds the first board; ESP-IDF 5 is given the directories
        include:
          - idf: release-v5.5
            first: idf.py -B build/cyd_s028r -D SDKCONFIG=build/cyd_s028r/sdkconfig -D BOARD=cyd_s028r build
            second: idf.py -B build/jc8012p4a1c -D SDKCONFIG=build/jc8012p4a1c/sdkconfig -D BOARD=jc8012p4a1c build
          - idf: v6.1
            first: idf.py build
            second: idf.py --preset jc8012p4a1c build
    steps:
      - uses: actions/checkout@v4
      # the component manager keeps what it downloads in .component-cache, which actions/cache keeps between runs:
      # a run took DGX from the registry some 60 times
      - name: keep the components downloaded
        uses: actions/cache@v4
        with:
          path: .component-cache
          key: components-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: components-
      - name: choose the boards
        run: python3 tools/board_select.py cyd_s028r jc8012p4a1c examples/multi_board
      - name: build for the CYD S028R
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: esp32
          path: examples/multi_board
          command: ${{ matrix.first }}
      - name: build for the JC8012P4A1C beside it
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: ${{ matrix.idf }}
          target: esp32p4
          path: examples/multi_board
          command: ${{ matrix.second }}
      - name: the JC8012P4A1C asked of a build of the default preset, another chip, stops the configure with a message
        if: matrix.idf == 'v6.1'
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: v6.1
          target: esp32
          path: examples/multi_board
          command: >-
            ! idf.py -B build/asked -D SDKCONFIG=build/asked/sdkconfig -D BOARD=jc8012p4a1c reconfigure > asked.log 2>&1 &&
            cat asked.log && grep -q "the board jc8012p4a1c was asked for" asked.log

  example:
    name: the example the registry hands out, on ESP-IDF v6.1
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the component manager keeps what it downloads in .component-cache, which actions/cache keeps between runs:
      # a run took DGX from the registry some 60 times
      - name: keep the components downloaded
        uses: actions/cache@v4
        with:
          path: .component-cache
          key: components-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: components-
      - name: pack the component, take its example from the archive with the component at this commit, build it for a board of another chip than the first reconfigure
        uses: espressif/esp-idf-ci-action@v1
        with:
          extra_docker_args: -e IDF_COMPONENT_CACHE_PATH=/app/${{ github.repository }}/.component-cache
          esp_idf_version: v6.1
          command: >-
            unset IDF_TARGET &&
            compote component pack --name boards &&
            python3 test/registry_example.py dist hello ${{ github.event.pull_request.head.sha || github.sha }} &&
            cd hello &&
            idf.py reconfigure &&
            python3 managed_components/jef-sure__boards/tools/board_select.py jc4827w543c . &&
            idf.py build
