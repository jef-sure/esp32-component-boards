## IDF Component Manager Manifest File
version: "0.2.1"
description: "Write an ESP-IDF program once and choose the board when you build it: a board of the catalog, a board of your own, or a window on the computer that shows the display of the chosen board. The component sets up the display, touch, sound, radio, buttons and buses of that board; the program asks for parts by kind, never by the board's name. Each board is described once as data, each fact with its source, and a build downloads only the libraries of the chosen board."
url: https://github.com/jef-sure/esp32-component-boards
repository: https://github.com/jef-sure/esp32-component-boards.git
documentation: https://github.com/jef-sure/esp32-component-boards/blob/main/README.md
issues: https://github.com/jef-sure/esp32-component-boards/issues

dependencies:
  idf:
    version: ">=5.5.0"  # the versions the boards are built with in CI (esp_driver_i2c, esp_driver_dac as components of their own)
  # boards: dependencies generated
  # What a board needs beside this component comes only with the board that needs it: the
  # rules look at the symbols the Kconfig of the boards defines beside the choice (the model of
  # esp-bsp's bsp_selector). Made by tools/boards_gen.py --all from the data: do not edit here.
  atanisoft/esp_lcd_touch_xpt2046:
    version: "^1.0.6"
    matches:
      - if: "$CONFIG{BOARD_TOUCH_XPT2046} == 1"
  espressif/esp_codec_dev:
    version: "~1.6.2"
    matches:
      - if: "$CONFIG{BOARD_SOUND_ES8311} == 1"
  espressif/esp_hosted:
    version: "~3.0.9"
    matches:
      - if: "$CONFIG{BOARD_RADIO_ESP_HOSTED} == 1"
  espressif/esp_lcd_touch_gt911:
    version: "^1.1.1"
    matches:
      - if: "$CONFIG{BOARD_TOUCH_GT911} == 1"
  espressif/esp_wifi_remote:
    version: "^1.3.1"
    matches:
      - if: "$CONFIG{BOARD_RADIO_ESP_HOSTED} == 1"
    rules:
      - if: "idf_version <6.1"
  jef-sure/dgx:
    version: ">=0.10.12,<0.13.0"
    matches:
      - if: "$CONFIG{BOARD_DISPLAY_GRAPHICS} == 1"
  jef-sure/dgx-di:
    version: ">=0.1.5,<0.3.0"
    matches:
      - if: "$CONFIG{BOARD_TOUCH} == 1"
  jef-sure/hd44780:
    version: "^0.1.2"
    matches:
      - if: "$CONFIG{BOARD_DISPLAY_HD44780} == 1"
  # boards: end of generated

tags:
  - board
  - bsp
  - display
  - touch
  - dgx

maintainers:
  - "Anton Petrusevich <anton.petrusevich.mobile@gmail.com>"

license: MIT

files:
  # Only what is listed under include goes into the archive: include is applied after exclude and brings back what
  # exclude took, so exclude takes everything first. The manager does not read .gitignore.
  exclude:
    - "**/*"
  include:
    - "idf_component.yml"
    - "CMakeLists.txt"
    - "project_include.cmake"
    - "Kconfig"
    - "include/**/*.h"
    - "src/**/*.c"
    - "src/**/*.h"
    - "adapters/**/*.c"
    - "adapters/**/*.h"
    - "boards/**/*.c"
    - "boards/**/*.cmake"
    - "catalog/**/*.json"
    - "catalog/**/*.webp"
    - "catalog/**/sdkconfig.defaults"
    # the two programs of the radio beside the chip, which tools/board_radio.py builds in the build directory of a program
    - "radio/*/CMakeLists.txt"
    - "radio/*/main/CMakeLists.txt"
    - "radio/*/main/*.c"
    - "radio/*/sdkconfig.defaults*"
    - "radio/*/partitions.csv"
    # the data imported from others, unchecked, for the page and the solver, with the licenses it comes under (LICENSES.md)
    - "imported/**/*.json"
    - "imported/README.md"
    - "imported/licenses/*"
    # the tools a program uses and what they import; the checks, imports and audits need test/ or the network
    - "tools/board_select.py"
    - "tools/vscode_env.py"
    - "tools/board_radio.py"
    - "tools/board_project.py"
    - "tools/board_pins.py"
    - "tools/board_bom.py"
    - "tools/board_calibration.py"
    - "tools/boards_mcp.py"
    - "tools/project_writer.py"
    - "tools/boards_gen.py"
    - "tools/resolve.py"
    - "tools/rules.py"
    - "editor/**/*"
    # the one example the registry hands out, as it builds from there; the others take the component by the path of a
    # clone, for CI, and stay out
    - "examples/hello/.gitignore"
    - "examples/hello/CMakeLists.txt"
    - "examples/hello/README.md"
    - "examples/hello/main/*"
    - "docs/**/*.md"
    - "README.md"
    - "README.ru.md"
    - "CHANGES.md"
    - "LICENSE"
    - "LICENSES.md"
